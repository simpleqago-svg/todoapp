<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - To-Do Приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 600;
            color: #667eea;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid #e8e8e8;
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            position: relative;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:not(.active):hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: white;
            font-family: inherit;
            color: #333;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #999;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background: #5568d3;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 400;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #fff5f5;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
        }

        .alert-success {
            background: #f0f9f4;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .form-section {
            display: none;
            animation: fadeIn 0.2s ease-out;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 32px 24px;
            }

            .logo-text {
                font-size: 24px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-text">✓ To-Do</div>
        </div>
        <p class="subtitle">Добро пожаловать!</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Вход</button>
            <button class="tab" onclick="switchTab('register')">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="loginForm" action="/login" method="POST" class="form-section active">
            <div class="form-group">
                <label for="login_username">Имя пользователя</label>
                <input 
                    type="text" 
                    id="login_username"
                    name="username" 
                    placeholder="Введите имя пользователя" 
                    required
                    autocomplete="username"
                >
            </div>
            <div class="form-group">
                <label for="login_password">Пароль</label>
                <input 
                    type="password" 
                    id="login_password"
                    name="password" 
                    placeholder="Введите пароль" 
                    required
                    autocomplete="current-password"
                >
            </div>
            <button type="submit">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form id="registerForm" action="/register" method="POST" class="form-section">
            <div class="form-group">
                <label for="register_username">Имя пользователя</label>
                <input 
                    type="text" 
                    id="register_username"
                    name="username" 
                    placeholder="Придумайте имя пользователя" 
                    required
                    autocomplete="username"
                >
            </div>
            <div class="form-group">
                <label for="register_password">Пароль</label>
                <input 
                    type="password" 
                    id="register_password"
                    name="password" 
                    placeholder="Минимум 4 символа" 
                    required
                    autocomplete="new-password"
                    minlength="4"
                >
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль</label>
                <input 
                    type="password" 
                    id="confirm_password"
                    name="confirm_password" 
                    placeholder="Повторите пароль" 
                    required
                    autocomplete="new-password"
                    minlength="4"
                >
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-section');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('register_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Пароли не совпадают!');
            }
        });
    </script>
</body>
</html>
